[package]
name = "neoflash-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neoflash-core.workspace = true
neoflash-script.workspace = true
neoflash-import = { path = "../neoflash-import" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
cfb = "0.15"
flate2 = "1"
image.workspace = true
walrus = "0.23"
url = "2.5.8"
tiny-skia = "0.12.0"
ab_glyph = "0.2.32"
gif = "0.14.2"
color_quant = "1.1.0"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "pcm", "wav"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
