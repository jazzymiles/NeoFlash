[package]
name = "neoflash-ui"
description = "NeoFlash design system NF2: tokens, typography, icons, cursors and egui components"
version.workspace = true
edition.workspace = true
license.workspace = true

# The design system knows nothing about documents, scripts or export.
# Never add neoflash-core / neoflash-script / neoflash-export / neoflash-import here.
[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
resvg = { version = "=0.49.0", default-features = false }

[build-dependencies]
serde_json.workspace = true

[[example]]
name = "gallery"

[dev-dependencies]
image.workspace = true
# The gallery opens a native window; same Metal backend as the editor.
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }
