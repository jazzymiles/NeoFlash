name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Validate Rust, WASM and HTML5
        run: ./scripts/check.sh
