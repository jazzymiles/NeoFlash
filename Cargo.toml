[workspace]
members = ["crates/*"]
exclude = ["vendor/egui-winit", "vendor/eframe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
base64 = "0.22"
serde_json = "1"
thiserror = "2"
neoflash-core = { path = "crates/neoflash-core" }
neoflash-script = { path = "crates/neoflash-script" }
neoflash-export = { path = "crates/neoflash-export" }

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
eframe = { path = "vendor/eframe" }
